# DEMO PUBLICA DE GANADERO (demoganadera.ejaniot.com, 05/11/2026): «FINCA LA ESPERANZA» (db/DEMO/), SE RESIEMBRA CADA MADRUGADA
# /api/seguridad/ -> ms-seguridad (127.0.0.1:3020)   /api/logica/ -> ms-logica (127.0.0.1:3021)
# VER V:\proyectos\documentacion general\servidor\DOCUMENTACION_SERVIDOR.md (SECCION DEMO DE GANADERO)
<VirtualHost *:80>
  ServerName demoganadera.ejaniot.com

  RewriteEngine On
  RewriteCond %{HTTPS} off
  RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
</VirtualHost>

<VirtualHost *:443>
  ServerName demoganadera.ejaniot.com

  SSLEngine on
  SSLCertificateFile /etc/letsencrypt/live/demoganadera.ejaniot.com/fullchain.pem
  SSLCertificateKeyFile /etc/letsencrypt/live/demoganadera.ejaniot.com/privkey.pem

  # BACKENDS: APACHE LES PASA LA PETICION POR DENTRO DEL SERVIDOR
  ProxyPreserveHost On
  RequestHeader set X-Forwarded-Proto "https"
  ProxyPass        /api/seguridad/ http://127.0.0.1:3020/
  ProxyPassReverse /api/seguridad/ http://127.0.0.1:3020/
  ProxyPass        /api/logica/    http://127.0.0.1:3021/
  ProxyPassReverse /api/logica/    http://127.0.0.1:3021/

  DocumentRoot /var/www/demoganadera/dist

  <Directory /var/www/demoganadera/dist>
    Options FollowSymLinks
    AllowOverride All
    Require all granted
  </Directory>

  RewriteEngine On

  # LAS RUTAS DE LA API NO SE TOCAN (LAS ATIENDE EL PROXY)
  RewriteRule ^/api/ - [L]

  # SIRVE ARCHIVOS Y CARPETAS REALES NORMALMENTE (DENTRO DEL VHOST SE USA DOCUMENT_ROOT + REQUEST_URI, NO REQUEST_FILENAME)
  RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} -f [OR]
  RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} -d
  RewriteRule ^ - [L]

  # RUTAS DE ANGULAR SIN EXTENSION: index.html
  RewriteCond %{REQUEST_URI} !\.[a-zA-Z0-9]+$
  RewriteRule ^ /index.html [L]

  ErrorLog ${APACHE_LOG_DIR}/demoganadera-error.log
  CustomLog ${APACHE_LOG_DIR}/demoganadera-access.log combined
</VirtualHost>

<figure class="m-0">
  @if (titulo) {
    <figcaption class="font-bold mb-1">{{ titulo }}</figcaption>
  }
  @if (datos.length === 0) {
    <p class="ayuda m-0">Sin datos en este periodo.</p>
  } @else {
    <!-- LA ETIQUETA DEL DATO TOCADO (VALOR PRIMERO, EN TINTA) -->
    <p class="text-sm m-0 mb-1 min-h-[1.4em]" aria-live="polite">
      @if (textoActivo) { <b>{{ textoActivo }}</b> } @else { <span class="text-suave">Toca una barra para ver su número.</span> }
    </p>

    @if (!horizontal) {
      <!-- COLUMNAS (UNA POR MES) -->
      <svg [attr.viewBox]="'0 0 ' + ancho + ' ' + altoColumnas" class="w-full h-auto block" role="img" [attr.aria-label]="titulo">
        @for (v of lineas; track v) {
          <line [attr.x1]="margenIzq" [attr.x2]="ancho" [attr.y1]="yLinea(v)" [attr.y2]="yLinea(v)" stroke="var(--borde)" stroke-width="1" stroke-dasharray="3 4" />
          <text [attr.x]="ancho" [attr.y]="yLinea(v) - 4" text-anchor="end" font-size="10" fill="var(--suave)">{{ fmt(v) }}</text>
        }
        <line [attr.x1]="margenIzq" [attr.x2]="ancho" [attr.y1]="yBase()" [attr.y2]="yBase()" stroke="var(--suave)" stroke-width="1" />
        @for (d of datos; track $index; let i = $index) {
          <path [attr.d]="caminoColumna(i)" fill="var(--primario)" [attr.opacity]="activo === null || activo === i ? 1 : 0.45" />
          @if (conValor(i) && d.valor > 0) {
            <text [attr.x]="xColumna(i) + grosor / 2" [attr.y]="yBase() - altoColumna(d.valor) - 5" text-anchor="middle" font-size="11" font-weight="700" fill="var(--texto)">{{ fmt(d.valor) }}</text>
          }
          @if (i % pasoEtiquetas === 0) {
            <text [attr.x]="xColumna(i) + grosor / 2" [attr.y]="altoColumnas - 8" text-anchor="middle" font-size="10" fill="var(--suave)">{{ d.etiqueta }}</text>
          }
          <!-- AREA TACTIL: TODA LA BANDA DE LA COLUMNA, MAS GRANDE QUE LA BARRA -->
          <rect [attr.x]="margenIzq + i * banda" y="0" [attr.width]="banda" [attr.height]="altoColumnas" fill="transparent" class="cursor-pointer"
            tabindex="0" role="button" [attr.aria-label]="(d.detalle ?? d.etiqueta) + ': ' + fmt(d.valor) + ' ' + unidad"
            (click)="tocar(i)" (mouseenter)="activo = i" (mouseleave)="activo = null" (focus)="activo = i" (blur)="activo = null" (keydown.enter)="tocar(i)" />
        }
      </svg>
    } @else {
      <!-- BARRAS HORIZONTALES (POCAS CATEGORIAS: EL VALOR VA EN LA PUNTA DE CADA UNA) -->
      <svg [attr.viewBox]="'0 0 ' + ancho + ' ' + altoHorizontal" class="w-full h-auto block" role="img" [attr.aria-label]="titulo">
        @for (d of datos; track $index; let i = $index) {
          <text x="0" [attr.y]="i * filaHorizontal + filaHorizontal / 2 + 4" font-size="13" fill="var(--texto)">{{ etiquetaCorta(d.etiqueta) }}</text>
          <path [attr.d]="caminoBarra(i)" fill="var(--primario)" [attr.opacity]="activo === null || activo === i ? 1 : 0.45" />
          <text [attr.x]="etiquetaHorizontal + largoBarra(d.valor) + 6" [attr.y]="i * filaHorizontal + filaHorizontal / 2 + 4" font-size="13" font-weight="700" fill="var(--texto)">{{ fmt(d.valor) }}{{ unidad ? ' ' + unidad : '' }}</text>
          <rect x="0" [attr.y]="i * filaHorizontal" [attr.width]="ancho" [attr.height]="filaHorizontal" fill="transparent" class="cursor-pointer"
            tabindex="0" role="button" [attr.aria-label]="(d.detalle ?? d.etiqueta) + ': ' + fmt(d.valor) + ' ' + unidad"
            (click)="tocar(i)" (mouseenter)="activo = i" (mouseleave)="activo = null" (focus)="activo = i" (blur)="activo = null" (keydown.enter)="tocar(i)" />
        }
      </svg>
    }

    <!-- LA TABLA: TODOS LOS NUMEROS SIN DEPENDER DE LA GRAFICA -->
    <button type="button" class="text-sm font-bold text-primario-texto bg-transparent border-0 p-0 mt-2 cursor-pointer underline" (click)="verTabla = !verTabla">
      {{ verTabla ? 'Ocultar la tabla' : 'Ver la tabla' }}
    </button>
    @if (verTabla) {
      <table class="tabla-finca w-full mt-2 text-sm">
        <tbody>
          @for (d of datos; track $index) {
            <tr><td>{{ d.detalle ?? d.etiqueta }}</td><td class="text-right font-bold">{{ fmt(d.valor) }}{{ unidad ? ' ' + unidad : '' }}</td></tr>
          }
        </tbody>
      </table>
    }
  }
</figure>
